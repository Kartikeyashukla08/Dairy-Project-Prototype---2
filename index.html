<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dairy Operations Prototype</title>
<style>
:root{--navy:#16324f;--blue:#2364aa;--teal:#2a9d8f;--bg:#f3f6fa;--card:#fff;--text:#17212b;--muted:#64748b;--border:#dce4ee;--red:#c2413b;--gold:#b7791f}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}button{touch-action:manipulation;-webkit-appearance:none;appearance:none}input,select,textarea{font-size:16px;min-height:42px;-webkit-appearance:none;appearance:none}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;background:var(--blue);color:white;font-weight:600}button.secondary{background:#e7edf5;color:var(--navy)}button.danger{background:var(--red)}button.small{padding:5px 8px;font-size:12px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;background:white;color:var(--text)}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:650}.field{margin-bottom:12px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#102a43,#2364aa)}.login-card{width:min(420px,100%);background:white;border-radius:18px;padding:28px;box-shadow:0 20px 70px #0003}.brand{font-size:24px;font-weight:800;color:var(--navy);margin-bottom:4px}.hint{color:var(--muted);font-size:12px}.login-card .field{margin-top:16px}
#app{display:none;min-height:100vh}.topbar{height:64px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}.topbar .brand{color:white;font-size:18px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--border);padding:14px 10px}.navbtn{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;color:#334155;font-weight:600}.navbtn.active,.navbtn:hover{background:#e8f1fb;color:var(--blue)}main{padding:22px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.page-head h1{font-size:24px;margin:0 0 4px}.page-head p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat,.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 2px 8px #0f172a05}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:24px;font-weight:800;margin-top:5px}.panel{margin-bottom:16px}.panel h2{font-size:16px;margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.formgrid .wide{grid-column:span 2}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.04em}td{font-size:13px}.empty{text-align:center;color:var(--muted);padding:25px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:260px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:#e8f6f3;color:#137567;font-size:11px;font-weight:700}.notice{padding:11px 13px;background:#fff8e6;border:1px solid #f2dfad;border-radius:9px;color:#7c5b14;margin-bottom:15px}.muted{color:var(--muted)}.hidden{display:none!important}.right{margin-left:auto}.actions{display:flex;gap:6px}.checkboxline{display:flex;align-items:center;gap:8px}.checkboxline input{width:auto}.section-note{font-size:12px;color:var(--muted);margin-top:8px}.footer-note{font-size:11px;color:var(--muted);margin-top:20px}.login-error{color:var(--red);font-size:12px;margin-top:8px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:5px;border-right:0;border-bottom:1px solid var(--border)}.navbtn{white-space:nowrap;width:auto}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){main{padding:13px}.topbar{padding:0 12px}.cards{grid-template-columns:1fr 1fr}.stat .value{font-size:19px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:span 1}.page-head{flex-direction:column}}
@media print{.topbar,aside,.no-print,button{display:none!important}#app{display:block!important}.layout{display:block}main{padding:0}.panel,.stat{box-shadow:none;break-inside:avoid}body{background:white}}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="brand">DairyDesk</div><div>Milk collection & business operations</div>
    <p class="hint">Prototype only · Demo data is saved in this browser</p>
    <div class="field"><label>Username</label><input id="username" value="owner" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" value="owner123" autocomplete="current-password"></div>
    <button style="width:100%;margin-top:6px" onclick="login()">Sign in</button>
    <div class="hint" style="margin-top:15px">Demo accounts: owner / owner123 · staff / staff123 · accountant / acct123</div>
    <div id="loginError" class="login-error"></div>
  </div>
</div>
<div id="app">
  <header class="topbar"><div class="brand">DairyDesk <span style="font-weight:400;font-size:12px;opacity:.75">/ Operations</span></div><div style="display:flex;align-items:center;gap:10px"><span id="whoami" style="font-size:12px"></span><button class="secondary small" onclick="logout()">Log out</button></div></header>
  <div class="layout"><aside id="nav"></aside><main id="main"></main></div>
</div>
<script>
const USERS={owner:{password:'owner123',role:'owner',name:'Owner'},staff:{password:'staff123',role:'staff',name:'Collection Staff'},accountant:{password:'acct123',role:'accountant',name:'Accountant'}};
const seed={farmers:[{id:1,name:'Ramesh Patel',phone:'9876500001',village:'Rampur',cycle:7,rate:38,active:true},{id:2,name:'Sita Bai',phone:'9876500002',village:'Kheda',cycle:10,rate:40,active:true}],milk:[],electricity:[],b2b:[],transfers:[],outlet:[],stock:[],incentives:[{id:1,name:'Sprayer Pump',target:5000,unit:'points',reward:'Farm sprayer',active:true}],ledger:[],audit:[],settings:{debt:50000,avgSellPrice:48}};
let db, user=null, page='Dashboard';
function load(){try{db=JSON.parse(localStorage.getItem('dairyDeskDB'))||structuredClone(seed)}catch(e){db=JSON.parse(JSON.stringify(seed))}if(!db.audit)db.audit=[]}
function save(){localStorage.setItem('dairyDeskDB',JSON.stringify(db))}
function login(){let u=document.getElementById('username').value.trim(),p=document.getElementById('password').value; if(USERS[u]&&USERS[u].password===p){user={username:u,...USERS[u]};document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('whoami').textContent=user.name+' · '+user.role;buildNav();render()}else document.getElementById('loginError').textContent='Invalid username or password.'}
function logout(){user=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='grid'}
function canSensitive(){return user&&['owner','accountant'].includes(user.role)}
function canManage(){return user&&user.role==='owner'}
const navItems=[['Dashboard','▦'],['Milk Collection','◉'],['Farmers','♙'],['Electricity','ϟ'],['B2B Sales','⇄'],['Outlet & Transfers','▣'],['Ledger & Payments','≡'],['Cash & Expenses','$'],['Debt & Stock','▤'],['Reports & Audit','▥'],['Users & Settings','⚙']];
function buildNav(){document.getElementById('nav').innerHTML=navItems.map(([n,ic])=>`<button class="navbtn ${page===n?'active':''}" onclick="go('${n}')">${ic} &nbsp;${n}</button>`).join('')}
function go(p){page=p;buildNav();render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function today(){return new Date().toISOString().slice(0,10)}
function sum(arr,key){return arr.reduce((a,x)=>a+Number(x[key]||0),0)}
function log(action,detail){db.audit.unshift({id:Date.now(),date:new Date().toLocaleString(),user:user.username,action,detail});db.audit=db.audit.slice(0,500);save()}
function addRow(key,obj,action){obj.id=Date.now()+Math.floor(Math.random()*1000);obj.createdBy=user.username;obj.createdAt=new Date().toISOString();db[key].unshift(obj);log(action||'Create '+key,JSON.stringify(obj));render()}
function pageHead(title,desc,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function panel(title,body,extra=''){return `<section class="panel"><h2>${title}</h2>${body}${extra}</section>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">No entries yet</td></tr>`}</tbody></table></div>`}
function field(label,name,type='text',value='',opts=''){return `<div class="field"><label>${label}</label>${type==='select'?`<select name="${name}">${opts}</select>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any"':''} required>`}</div>`}
function farmerOptions(){return db.farmers.filter(f=>f.active!==false).map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}
function formBox(fields,buttonText,handler){return `<form onsubmit="${handler}(event)" class="formgrid">${fields}<div class="field" style="align-self:end"><button>${buttonText}</button></div></form>`}
function render(){const m=document.getElementById('main');if(!user)return;switch(page){
case'Dashboard':m.innerHTML=dashboard();break;
case'Milk Collection':m.innerHTML=milkPage();break;
case'Farmers':m.innerHTML=farmersPage();break;
case'Electricity':m.innerHTML=electricityPage();break;
case'B2B Sales':m.innerHTML=b2bPage();break;
case'Outlet & Transfers':m.innerHTML=outletPage();break;
case'Ledger & Payments':m.innerHTML=ledgerPage();break;
case'Incentives':m.innerHTML=incentivesPage();break;
case'Cash & Expenses':m.innerHTML=cashPage();break;
case'Debt & Stock':m.innerHTML=debtPage();break;
case'Reports & Audit':m.innerHTML=reportsPage();break;
case'Users & Settings':m.innerHTML=settingsPage();break;
}}
function dashboard(){let qty=sum(db.milk.filter(x=>x.date===today()),'qty'), b2b=sum(db.b2b.filter(x=>x.date===today()),'amount'), paid=sum(db.ledger.filter(x=>x.type==='Payment'&&x.date===today()),'amount'), expenses=sum(db.outlet.filter(x=>x.kind==='Expense'&&x.date===today()),'amount');return pageHead('Dashboard','Today at a glance · '+today())+`<div class="cards"><div class="stat"><div class="label">Milk collected today</div><div class="value">${qty.toFixed(1)} L</div></div><div class="stat"><div class="label">B2B sales today</div><div class="value">${money(b2b)}</div></div><div class="stat"><div class="label">Farmer payments today</div><div class="value">${money(paid)}</div></div><div class="stat"><div class="label">Outlet expenses today</div><div class="value">${money(expenses)}</div></div></div><div class="notice">Prototype warning: this browser-only demo is not secure enough for real financial or customer data. Use a shared database and server-side permissions before client delivery.</div><div class="grid2">${panel('Recent milk entries',table(['Date','Farmer','Qty','Fat','Points','Entered by'],db.milk.slice(0,5).map(x=>`<tr><td>${x.date}</td><td>${esc(farmerName(x.farmerId))}</td><td>${x.qty} L</td><td>${x.fat}%</td><td>${(x.qty*x.fat).toFixed(1)}</td><td>${esc(x.createdBy)}</td></tr>`)))}${panel('Quick actions',`<div class="toolbar"><button onclick="go('Milk Collection')">+ Record milk</button><button class="secondary" onclick="go('Electricity')">+ Electricity reading</button><button class="secondary" onclick="go('B2B Sales')">+ B2B sale</button><button class="secondary" onclick="go('Ledger & Payments')">+ Ledger entry</button></div><p class="muted">Keep daily entries up to date to make reports and settlement totals useful.</p>`)}</div>`}
function farmerName(id){return db.farmers.find(f=>f.id==id)?.name||'Unknown farmer'}
function milkPage(){let fields=field('Date','date','date',today())+field('Farmer','farmerId','select','','<option value="">Choose farmer</option>'+farmerOptions())+field('Milk quantity (L)','qty','number')+field('Fat (%)','fat','number')+field('SNF (%) — optional','snf','number','0')+(canSensitive()?field('Rate (₹/L)','rate','number','0'):'')+field('Shift','shift','select','','<option>Morning</option><option>Evening</option>');let rows=db.milk.map(x=>`<tr><td>${x.date}</td><td>${esc(farmerName(x.farmerId))}</td><td>${x.qty}</td><td>${x.fat}%</td><td>${(x.qty*x.fat).toFixed(1)}</td>${canSensitive()?`<td>${money(x.rate)}</td><td>${money(x.amount)}</td>`:''}<td>${esc(x.shift)}</td><td>${esc(x.createdBy)}</td></tr>`);return pageHead('Milk Collection','Record farmer milk, fat, optional SNF and owner-controlled rate.')+panel('Add collection',formBox(fields,'Save milk entry','submitMilk')+`<div class="section-note">Staff can enter quantity and fat but cannot view the rate/amount. Rate access is hidden in this prototype UI; production access must be enforced by the server.</div>`)+panel('Collection register',`<div class="toolbar no-print"><button class="secondary" onclick="window.print()">Print register</button><input id="milkSearch" placeholder="Search farmer" oninput="filterTable('milkSearch','milkTable')"></div><div id="milkTable">${table(['Date','Farmer','Qty (L)','Fat','Points','Rate','Amount','Shift','Entered by'].filter(h=>canSensitive()||!['Rate','Amount'].includes(h)),rows)}</div>`)}
function submitMilk(e){e.preventDefault();let f=new FormData(e.target),qty=+f.get('qty'),fat=+f.get('fat'),farmerId=+f.get('farmerId'),farmer=db.farmers.find(x=>x.id===farmerId);if(!farmer)return alert('Select a farmer');let rate=canSensitive()?(+f.get('rate')||farmer.rate):farmer.rate;addRow('milk',{date:f.get('date'),farmerId,qty,fat,snf:+f.get('snf')||0,rate,amount:qty*rate,shift:f.get('shift')},'Milk entry');}
function farmersPage(){let fields=field('Farmer name','name')+field('Phone','phone')+field('Village','village')+field('Payment cycle (days)','cycle','number','7')+(canManage()?field('Default rate (₹/L)','rate','number','38'):'');let rows=db.farmers.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.phone)}</td><td>${esc(f.village)}</td><td>${f.cycle} days</td>${canSensitive()?`<td>${money(f.rate)}/L</td>`:''}<td>${f.active===false?'Inactive':'Active'}</td><td>${esc(f.createdBy||'—')}</td></tr>`);return pageHead('Farmers','Farmer master data and individual payment cycles.')+ (canManage()?panel('Add farmer',formBox(fields,'Add farmer','submitFarmer')):'')+panel('Farmer directory',table(['Name','Phone','Village','Payment cycle',...(canSensitive()?['Default rate']:[]),'Status','Created by'],rows))}
function submitFarmer(e){e.preventDefault();let f=new FormData(e.target);addRow('farmers',{name:f.get('name'),phone:f.get('phone'),village:f.get('village'),cycle:+f.get('cycle')||7,rate:+f.get('rate')||0,active:true},'Add farmer')}
function electricityPage(){let fields=field('Date','date','date',today())+field('Meter opening unit','opening','number')+field('Meter closing unit','closing','number')+field('Cost per unit (₹)','unitRate','number','8')+field('Notes','notes');let rows=db.electricity.map(x=>`<tr><td>${x.date}</td><td>${x.opening}</td><td>${x.closing}</td><td>${(x.closing-x.opening).toFixed(2)}</td><td>${money((x.closing-x.opening)*x.unitRate)}</td><td>${esc(x.notes)}</td><td>${esc(x.createdBy)}</td></tr>`);return pageHead('Electricity','Daily meter readings and estimated daily electricity charges.')+panel('Add daily reading',formBox(fields,'Save reading','submitElectricity'))+panel('Electricity register',table(['Date','Opening','Closing','Units used','Estimated charge','Notes','Entered by'],rows))}
function submitElectricity(e){e.preventDefault();let f=new FormData(e.target),opening=+f.get('opening'),closing=+f.get('closing');if(closing<opening)return alert('Closing reading cannot be lower than opening reading.');addRow('electricity',{date:f.get('date'),opening,closing,units:closing-opening,unitRate:+f.get('unitRate'),notes:f.get('notes')},'Electricity reading')}
function b2bPage(){let fields=field('Date','date','date',today())+field('Customer / buyer','customer')+field('Milk quantity (L)','qty','number')+field('Price per litre (₹)','rate','number')+field('Payment status','status','select','','<option>Unpaid</option><option>Part-paid</option><option>Paid</option>')+field('Notes','notes');let rows=db.b2b.map(x=>`<tr><td>${x.date}</td><td>${esc(x.customer)}</td><td>${x.qty} L</td><td>${money(x.rate)}/L</td><td>${money(x.amount)}</td><td>${esc(x.status)}</td><td>${esc(x.createdBy)}</td></tr>`);return pageHead('B2B Milk Sales','Simple sales register for bulk milk supplied to business customers.')+panel('Add B2B sale',formBox(fields,'Save sale','submitB2B'))+panel('Sales register',table(['Date','Customer','Quantity','Rate','Total amount','Status','Entered by'],rows))}
function submitB2B(e){e.preventDefault();let f=new FormData(e.target),qty=+f.get('qty'),rate=+f.get('rate');addRow('b2b',{date:f.get('date'),customer:f.get('customer'),qty,rate,amount:qty*rate,status:f.get('status'),notes:f.get('notes')},'B2B sale')}
function outletPage(){let transferFields=field('Date','date','date',today())+field('Milk transferred (L)','qty','number')+field('Destination / outlet','destination')+field('Batch / note','notes');let outletFields=field('Date','date','date',today())+field('Cash collected (₹)','cash','number','0')+field('Expenses (₹)','expense','number','0')+field('Expense note','note');let rows=db.transfers.map(x=>`<tr><td>${x.date}</td><td>${x.qty} L</td><td>${esc(x.destination)}</td><td>${esc(x.notes)}</td><td>${esc(x.createdBy)}</td></tr>`);let orows=db.outlet.map(x=>`<tr><td>${x.date}</td><td>${x.kind}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td><td>${esc(x.createdBy)}</td></tr>`);return pageHead('Outlet & Transfers','Track milk sent for pouch packing and outlet daily cash flow.')+`<div class="grid2">${panel('Milk transfer to pouch outlet',formBox(transferFields,'Record transfer','submitTransfer'))}${panel('Daily outlet cash & expense',formBox(outletFields,'Save cash summary','submitOutlet'))}</div>`+panel('Milk transfers',table(['Date','Quantity','Destination','Notes','Entered by'],rows))+panel('Outlet cash/expense history',table(['Date','Type','Amount','Note','Entered by'],orows))}
function submitTransfer(e){e.preventDefault();let f=new FormData(e.target);addRow('transfers',{date:f.get('date'),qty:+f.get('qty'),destination:f.get('destination'),notes:f.get('notes')},'Milk transfer')}
function submitOutlet(e){e.preventDefault();let f=new FormData(e.target);if(+f.get('cash')>0)addRow('outlet',{date:f.get('date'),kind:'Cash collection',amount:+f.get('cash'),note:f.get('note')},'Outlet cash');if(+f.get('expense')>0)addRow('outlet',{date:f.get('date'),kind:'Expense',amount:+f.get('expense'),note:f.get('note')},'Outlet expense')}
function ledgerPage(){let fields=field('Date','date','date',today())+field('Farmer','farmerId','select','','<option value="">Choose farmer</option>'+farmerOptions())+field('Entry type','type','select','','<option>Advance</option><option>Payment</option><option>Adjustment</option><option>Purchase / other</option>')+field('Amount (₹)','amount','number')+field('Reference / note','note');let rows=db.ledger.map(x=>`<tr><td>${x.date}</td><td>${esc(farmerName(x.farmerId))}</td><td>${esc(x.type)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td><td>${esc(x.createdBy)}</td></tr>`);let balances=db.farmers.map(f=>{let milk=sum(db.milk.filter(x=>x.farmerId===f.id),'amount'),pay=sum(db.ledger.filter(x=>x.farmerId===f.id&&['Payment','Advance'].includes(x.type)),'amount');return `<tr><td>${esc(f.name)}</td><td>${money(milk)}</td><td>${money(pay)}</td><td>${money(milk-pay)}</td><td>${f.cycle} days</td><td><button class="secondary small" onclick="printFarmer(${f.id})">Print statement</button></td></tr>`});return pageHead('Ledger & Payments','Farmer-wise dues, advances, payments and settlement statements.')+panel('Add ledger transaction',formBox(fields,'Save ledger entry','submitLedger'))+panel('Farmer balances',table(['Farmer','Milk value','Payments/advances','Estimated balance','Cycle','Proof'],balances))+panel('Transaction history',table(['Date','Farmer','Type','Amount','Note','Entered by'],rows))}
function submitLedger(e){e.preventDefault();let f=new FormData(e.target);addRow('ledger',{date:f.get('date'),farmerId:+f.get('farmerId'),type:f.get('type'),amount:+f.get('amount'),note:f.get('note')},'Ledger transaction')}
function printFarmer(id){let f=db.farmers.find(x=>x.id===id),milks=db.milk.filter(x=>x.farmerId===id),led=db.ledger.filter(x=>x.farmerId===id),qty=sum(milks,'qty'),points=milks.reduce((a,x)=>a+x.qty*x.fat,0),value=sum(milks,'amount'),paid=sum(led.filter(x=>['Payment','Advance'].includes(x.type)),'amount');let w=window.open('','_blank');w.document.write(`<html><head><title>Farmer statement</title><style>body{font:14px Arial;padding:30px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:8px;text-align:left}.sign{margin-top:70px;display:flex;justify-content:space-between}</style></head><body><h2>Milk Collection Statement / Advance Proof</h2><p>Farmer: <b>${esc(f.name)}</b> &nbsp; Village: ${esc(f.village)}<br>Generated: ${new Date().toLocaleDateString()}</p><p>Total milk: ${qty.toFixed(2)} L &nbsp; Points (Fat × Quantity): ${points.toFixed(2)} &nbsp; Milk value: ${money(value)} &nbsp; Payments/advances: ${money(paid)} &nbsp; Estimated balance: ${money(value-paid)}</p><table><tr><th>Date</th><th>Qty (L)</th><th>Fat %</th><th>Points</th><th>Rate</th><th>Amount</th></tr>${milks.map(x=>`<tr><td>${x.date}</td><td>${x.qty}</td><td>${x.fat}</td><td>${(x.qty*x.fat).toFixed(2)}</td><td>${money(x.rate)}</td><td>${money(x.amount)}</td></tr>`).join('')}</table><div class="sign"><div>Farmer signature: ____________________</div><div>Collection centre: ____________________</div></div><p>Note: Please verify figures before signing. This is a system-generated prototype statement.</p><script>window.onload=()=>window.print()<\\/script></body></html>`);w.document.close()}
function incentivesPage(){let fields=field('Offer / reward name','name')+field('Target points or litres','target','number')+field('Target unit','unit','select','','<option>points</option><option>litres</option>')+field('Reward description','reward');let rows=db.incentives.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.target} ${x.unit}</td><td>${esc(x.reward)}</td><td>${x.active?'Active':'Inactive'}</td></tr>`);let totals=db.farmers.map(f=>{let ms=db.milk.filter(x=>x.farmerId===f.id),pts=ms.reduce((a,x)=>a+x.qty*x.fat,0),qty=sum(ms,'qty');return `<tr><td>${esc(f.name)}</td><td>${qty.toFixed(1)} L</td><td>${pts.toFixed(1)}</td><td>${db.incentives.filter(i=>i.active).map(i=>`${esc(i.name)}: ${((i.unit==='points'?pts:qty)/i.target*100).toFixed(0)}%`).join('<br>')}</td></tr>`});return pageHead('Incentives & Offers','Define reward targets and see farmer progress. Reminders are manual in this prototype.')+(canManage()?panel('Create offer',formBox(fields,'Add offer','submitIncentive')):'')+panel('Offer rules',table(['Offer','Target','Reward','Status'],rows))+panel('Farmer progress (all-time prototype totals)',table(['Farmer','Milk total','Points total','Offer progress'],totals))+panel('Reminder workflow',`<p>Use the farmer phone list to send a reminder when a farmer is close to a target. For automated SMS/WhatsApp, connect an approved messaging provider and obtain consent; this prototype does not send messages.`)}
function submitIncentive(e){e.preventDefault();let f=new FormData(e.target);addRow('incentives',{name:f.get('name'),target:+f.get('target'),unit:f.get('unit'),reward:f.get('reward'),active:true},'Create incentive')}
function cashPage(){go('Outlet & Transfers')}
function debtPage(){let stockFields=field('Date','date','date',today())+field('Raw material','item')+field('Quantity','qty','number')+field('Unit','unit','select','','<option>kg</option><option>litre</option><option>bag</option><option>piece</option><option>pack</option>')+field('Unit cost (₹)','cost','number')+field('Supplier','supplier');let stockRows=db.stock.map(x=>`<tr><td>${x.date}</td><td>${esc(x.item)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.cost)}</td><td>${money(x.qty*x.cost)}</td><td>${esc(x.supplier)}</td><td>${esc(x.createdBy)}</td></tr>`);let b2bRevenue=sum(db.b2b,'amount'),cash=sum(db.outlet.filter(x=>x.kind==='Cash collection'),'amount'),exp=sum(db.outlet.filter(x=>x.kind==='Expense'),'amount'),debt=+db.settings.debt||0,price=+db.settings.avgSellPrice||1;return pageHead('Debt & Raw Material Stock','Track business debt, sales target and raw material purchases.')+`<div class="cards"><div class="stat"><div class="label">Outstanding debt (owner-entered)</div><div class="value">${money(debt)}</div></div><div class="stat"><div class="label">B2B revenue recorded</div><div class="value">${money(b2bRevenue)}</div></div><div class="stat"><div class="label">Approx. litres to sell to cover debt</div><div class="value">${Math.ceil(debt/Math.max(price,1)).toLocaleString('en-IN')} L</div></div><div class="stat"><div class="label">Outlet net cash (recorded)</div><div class="value">${money(cash-exp)}</div></div></div>`+(canManage()?panel('Debt assumptions',`<form class="formgrid" onsubmit="saveDebt(event)">${field('Outstanding debt (₹)','debt','number',debt)}${field('Expected selling price (₹/L)','price','number',price)}<div class="field" style="align-self:end"><button>Update assumptions</button></div></form><p class="section-note">This simple estimate is debt ÷ selling price and ignores milk procurement costs, packaging, electricity, transport and other operating costs. For a useful target, calculate contribution margin, not gross sales.</p>`):'')+panel('Raw material purchase / stock entry',formBox(stockFields,'Save stock entry','submitStock'))+panel('Purchase history',table(['Date','Item','Quantity','Unit cost','Line total','Supplier','Entered by'],stockRows))}
function saveDebt(e){e.preventDefault();let f=new FormData(e.target);db.settings.debt=+f.get('debt');db.settings.avgSellPrice=+f.get('price');log('Update debt assumptions',JSON.stringify(db.settings));render()}
function submitStock(e){e.preventDefault();let f=new FormData(e.target);addRow('stock',{date:f.get('date'),item:f.get('item'),qty:+f.get('qty'),unit:f.get('unit'),cost:+f.get('cost'),supplier:f.get('supplier')},'Stock purchase')}
function reportsPage(){let weeks=db.milk.reduce((a,x)=>{let d=new Date(x.date+'T00:00:00'),start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7));let k=start.toISOString().slice(0,10);a[k]=a[k]||{qty:0,points:0,count:0};a[k].qty+=+x.qty;a[k].points+=x.qty*x.fat;a[k].count++;return a},{ });let weekRows=Object.entries(weeks).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<tr><td>${k} to ${new Date(new Date(k+'T00:00:00').getTime()+6*86400000).toISOString().slice(0,10)}</td><td>${v.qty.toFixed(1)} L</td><td>${v.points.toFixed(1)}</td><td>${v.count}</td></tr>`);let auditRows=db.audit.slice(0,100).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td style="white-space:normal;max-width:300px">${esc(x.detail)}</td></tr>`);return pageHead('Reports & Audit','Weekly collection totals, financial registers and activity history.',`<button class="no-print" onclick="printAllReports()">Download all reports as PDF</button>`)+`<div class="notice no-print">On iPhone Safari, tap “Download all reports as PDF”, then use the print/share options to save the report as a PDF in Files.</div>`+panel('Weekly collection totals',table(['Week starting Monday','Total milk','Total points','Entries'],weekRows))+panel('Audit log (recent 100)',table(['Timestamp','User','Action','Details'],auditRows))+panel('Data backup',`<p>Export the browser data as a JSON backup. Keep backups in a secure location; this file contains operational data.</p><button class="no-print" onclick="exportData()">Export JSON backup</button> <button class="secondary no-print" onclick="document.getElementById('importFile').click()">Import backup</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importData(event)"><p class="section-note">Import replaces the current browser dataset. Only import files you trust.</p>`)}
function printAllReports(){
 const rows=(headers,items)=>`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${items.length?items.join(''):`<tr><td colspan="${headers.length}">No entries</td></tr>`}</tbody></table>`;
 const section=(title,content)=>`<section><h2>${title}</h2>${content}</section>`;
 const milkRows=db.milk.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(farmerName(x.farmerId))}</td><td>${x.qty}</td><td>${x.fat}%</td><td>${(x.qty*x.fat).toFixed(2)}</td><td>${canSensitive()?money(x.rate):'Restricted'}</td><td>${canSensitive()?money(x.amount):'Restricted'}</td><td>${esc(x.createdBy)}</td></tr>`);
 const farmerRows=db.farmers.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.phone)}</td><td>${esc(f.village)}</td><td>${f.cycle} days</td><td>${canSensitive()?money(f.rate):'Restricted'}</td><td>${f.active===false?'Inactive':'Active'}</td></tr>`);
 const electricityRows=db.electricity.map(x=>`<tr><td>${esc(x.date)}</td><td>${x.opening}</td><td>${x.closing}</td><td>${(x.closing-x.opening).toFixed(2)}</td><td>${money((x.closing-x.opening)*x.unitRate)}</td><td>${esc(x.notes)}</td></tr>`);
 const b2bRows=db.b2b.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.customer)}</td><td>${x.qty}</td><td>${money(x.rate)}</td><td>${money(x.amount)}</td><td>${esc(x.status)}</td></tr>`);
 const transferRows=db.transfers.map(x=>`<tr><td>${esc(x.date)}</td><td>${x.qty}</td><td>${esc(x.destination)}</td><td>${esc(x.notes)}</td></tr>`);
 const outletRows=db.outlet.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.kind)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td></tr>`);
 const ledgerRows=db.ledger.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(farmerName(x.farmerId))}</td><td>${esc(x.type)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td></tr>`);
 const stockRows=db.stock.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.item)}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.cost)}</td><td>${money(x.qty*x.cost)}</td><td>${esc(x.supplier)}</td></tr>`);
 const auditRows=db.audit.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`);
 const cash=sum(db.outlet.filter(x=>x.kind==='Cash collection'),'amount'),expenses=sum(db.outlet.filter(x=>x.kind==='Expense'),'amount');
 const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DairyDesk — All Reports</title><style>body{font:12px -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#111;padding:18px}h1{font-size:22px}h2{font-size:16px;margin:22px 0 8px;break-after:avoid}p{line-height:1.5}table{border-collapse:collapse;width:100%;margin-bottom:14px;table-layout:auto}th,td{border:1px solid #aaa;padding:5px;text-align:left;overflow-wrap:anywhere}th{background:#eee}section{break-inside:auto}tr{break-inside:avoid}@media print{body{padding:0}@page{size:auto;margin:12mm}}</style></head><body><h1>DairyDesk — Complete Business Reports</h1><p>Generated: ${new Date().toLocaleString()}<br>Prepared by: ${esc(user.name)} (${esc(user.role)})</p><p><b>Summary:</b> Total milk recorded: ${sum(db.milk,'qty').toFixed(2)} L · B2B sales: ${money(sum(db.b2b,'amount'))} · Outlet cash collected: ${money(cash)} · Outlet expenses: ${money(expenses)} · Outstanding debt assumption: ${money(db.settings.debt)}</p>
 ${section('Farmer Directory',rows(['Farmer','Phone','Village','Payment cycle','Default rate','Status'],farmerRows))}
 ${section('Milk Collection Register',rows(['Date','Farmer','Qty (L)','Fat','Points','Rate','Amount','Entered by'],milkRows))}
 ${section('Electricity Readings',rows(['Date','Opening','Closing','Units','Estimated charge','Notes'],electricityRows))}
 ${section('B2B Sales',rows(['Date','Buyer','Qty (L)','Rate','Amount','Status'],b2bRows))}
 ${section('Milk Transfers to Outlet',rows(['Date','Qty (L)','Destination','Notes'],transferRows))}
 ${section('Outlet Cash Collections and Expenses',rows(['Date','Type','Amount','Note'],outletRows))}
 ${section('Farmer Ledger and Payments',rows(['Date','Farmer','Type','Amount','Note'],ledgerRows))}
 ${section('Raw Material Purchases / Stock Entries',rows(['Date','Item','Quantity','Unit cost','Line total','Supplier'],stockRows))}
 ${section('Activity Audit Log',rows(['Timestamp','User','Action','Details'],auditRows))}
 <p>End of report. Verify totals against source records before using this document for accounting or payment proof.</p><script>window.onload=()=>setTimeout(()=>window.print(),300)<\\/script></body></html>`;
 const w=window.open('','_blank');if(!w){alert('Safari blocked the report window. Allow pop-ups for this site, then try again.');return;}w.document.open();w.document.write(html);w.document.close();
}
function settingsPage(){return pageHead('Users & Settings','Demo roles and basic configuration.')+panel('Prototype users',table(['Username','Role','Permissions'],['<tr><td>owner</td><td>Owner</td><td>Full access, rate visibility, farmer management, debt settings</td></tr>','<tr><td>staff</td><td>Collection staff</td><td>Milk entry; rate and amounts hidden in UI</td></tr>','<tr><td>accountant</td><td>Accountant</td><td>Rate visibility, ledger and reports</td></tr>']))+panel('Important production requirements',`<ul><li>Move authentication to a server-side system; never store passwords in frontend code.</li><li>Enforce role permissions in backend/database policies, not just by hiding UI elements.</li><li>Use a shared database so owner and staff see the same live records from different devices.</li><li>Use server timestamps, immutable audit events, backups, HTTPS, and a recovery plan.</li><li>Add edit/delete approval flows, duplicate-entry checks, and daily close/reconciliation.</li></ul>`)+panel('Reset demo data',`<p class="muted">This clears this browser's prototype data and reloads sample farmers. Export a backup first if needed.</p><button class="danger" onclick="resetData()">Reset local data</button>`)}
function filterTable(inputId,tableId){let q=document.getElementById(inputId).value.toLowerCase();document.querySelectorAll('#'+tableId+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dairydesk-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj.farmers||!obj.milk)throw Error('Invalid file');if(confirm('Replace current data with this backup?')){db=obj;save();log('Import backup',file.name);render();alert('Backup imported.')}}catch(err){alert('Could not import: '+err.message)}};reader.readAsText(file)}
function resetData(){if(confirm('Delete this browser’s prototype data and restore demo data?')){db=JSON.parse(JSON.stringify(seed));save();log('Reset data','Demo seed restored');render()}}
load();
</script>
</body></html>
